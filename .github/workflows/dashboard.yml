name: Clubsite bijwerken

on:
  schedule:
    - cron: "0 5 * * *"   # elke ochtend (07:00 NL zomertijd)
    - cron: "30 22 * * *" # elke avond na de speelavond
    - cron: "30 23 * * *" # en nog een keer later op de avond
  workflow_dispatch:       # handmatig: tab Actions > Run workflow
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # keep-alive: workflow opnieuw inschakelen

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NTFY_BEHEER: dv-the-pirates-beheer-bf94f1f85a  # privé-topic: storingen, alleen voor de beheerder
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vorige stand ophalen (voor meldingen bij nieuwe uitslagen)
        run: curl -sf https://basvanderlit1-commits.github.io/dv-the-pirates/data.json -o prev.json || true
      - run: python scrape.py
        env:
          MELDINGEN: aan
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep-alive (GitHub schakelt geplande workflows uit na 60 dagen zonder commits)
        run: gh workflow enable dashboard.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alarm:  # build of uitrol mislukt: seintje aan de beheerder (de site toont dan nog de vorige stand)
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -sS -H "Title: Clubsite bijwerken mislukt" -H "Priority: high" -H "Tags: rotating_light"
          -H "Click: $RUN_URL" -d "De run is mislukt; de site toont nog de vorige stand. Tik voor het logboek."
          "https://ntfy.sh/$NTFY_BEHEER"
