name: Clubsite bijwerken

on:
  schedule:
    - cron: "0 5 * * *"               # elke ochtend volledig bijwerken (07:00 NL zomertijd)
    # speelavonden: elke 10 minuten een snelle check (UTC; dekt 22:00-01:00 NL in zomer- en wintertijd).
    # Alleen als er op teambeheer iets veranderd is, wordt de site gebouwd en gaan er meldingen uit.
    - cron: "3-53/10 20-23 * * *"
    - cron: "3,13,23 0 * * *"
  workflow_dispatch:                  # handmatig: tab Actions > Run workflow (bouwt altijd)
  push:
    branches: [main]                  # bouwt altijd

permissions:
  contents: write          # archief van het vorige seizoen bewaren (alleen bij de seizoenswissel)
  pages: write
  id-token: write
  actions: write           # keep-alive: workflow opnieuw inschakelen

concurrency:
  group: pages
  cancel-in-progress: false  # niet halverwege afbreken (tussen uitrol en meldingen); een nieuwe run wacht

env:
  NTFY_BEHEER: dv-the-pirates-beheer-bf94f1f85a  # privé-topic: storingen, alleen voor de beheerder
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bouwen: ${{ steps.check.outputs.bouwen }}
      meldingen: ${{ steps.wachtrij.outputs.meldingen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vorige stand ophalen (voor de check en voor meldingen bij nieuwe uitslagen)
        # ?nc= omzeilt de cache van GitHub Pages (10 min), anders kan een uitslag twee keer gemeld worden
        run: curl -sf "https://basvanderlit1-commits.github.io/dv-the-pirates/data.json?nc=$(date +%s)" -o prev.json || true
      - name: Iets veranderd op teambeheer? (avondrondes; 's ochtends, bij push en handmatig altijd bouwen)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 5 * * *" ]; then
            python scrape.py --check
          else
            echo "bouwen=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Controles (faalt er één, dan wordt er niets uitgerold)
        if: steps.check.outputs.bouwen == 'ja'
        run: python test_scrape.py
      - if: steps.check.outputs.bouwen == 'ja'
        run: python scrape.py
        env:
          MELDINGEN: aan     # meldingen gaan in de wachtrij; versturen gebeurt pas na de uitrol
      - id: wachtrij
        if: steps.check.outputs.bouwen == 'ja'
        run: echo "meldingen=$([ -s meldingen.jsonl ] && echo ja || echo nee)" >> "$GITHUB_OUTPUT"
      - if: steps.wachtrij.outputs.meldingen == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: meldingen
          path: meldingen.jsonl
          retention-days: 2
      - if: steps.check.outputs.bouwen == 'ja'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Archief vorig seizoen bewaren (alleen bij de seizoenswissel)
        if: steps.check.outputs.bouwen == 'ja'
        run: |
          if [ -n "$(git status --porcelain archief)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archief && git commit -m "Archief vorig seizoen"
            # tegelijk een push van iemand anders? dan eerst bijwerken; lukt het niet, dan probeert de volgende run het opnieuw
            git pull --rebase -q && git push || echo "Archief nu niet bewaard; volgende run probeert opnieuw"
          fi
      - name: Keep-alive (GitHub schakelt geplande workflows uit na 60 dagen zonder commits)
        run: gh workflow enable dashboard.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    if: needs.build.outputs.bouwen == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  meldingen:  # pas na een geslaagde uitrol: zo nooit dubbele meldingen als een run onderweg mislukt
    needs: [build, deploy]
    if: needs.build.outputs.meldingen == 'ja'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meldingen
      - name: Uitslagen versturen (ntfy)
        run: |
          mislukt=0
          while IFS= read -r bericht; do
            if curl -fsS --retry 3 -H "Content-Type: application/json" -d "$bericht" https://ntfy.sh/ > /dev/null; then
              echo "verstuurd: $bericht" | cut -c1-120
            else
              echo "MISLUKT: $bericht" | cut -c1-120; mislukt=$((mislukt + 1))
            fi
          done < meldingen.jsonl
          # mislukt er één, dan wordt de job rood en gaat het alarm af; opnieuw versturen kan 2 dagen via "Re-run jobs"
          [ "$mislukt" -eq 0 ]

  alarm:  # build, uitrol of meldingen mislukt: seintje aan de beheerder
    needs: [build, deploy, meldingen]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -sS -H "Title: Clubsite bijwerken mislukt" -H "Priority: high" -H "Tags: rotating_light"
          -H "Click: $RUN_URL" -d "De run is mislukt; de site toont nog de vorige stand. Tik voor het logboek."
          "https://ntfy.sh/$NTFY_BEHEER"
